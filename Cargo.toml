[package]
name = "herdr-status-bar"
version = "0.1.0"
edition = "2024"
description = "Context-based Zellij-inspired status bar for the Herdr workspace manager"
authors = ["Erich Json Fosse"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
ratatui = "0.29"
chrono = "0.4"
libc = "0.2"
toml = "0.8"
