[package]
name = "herdr-status-bar"
version = "0.1.0"
edition = "2024"
description = "Context-based Zellij-inspired status bar for the Herdr workspace manager"
authors = ["Erich Json Fosse"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
ratatui = "0.29"
libc = "0.2"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
