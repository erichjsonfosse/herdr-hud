[package]
name = "herdr-hud"
version = "0.1.0"
edition = "2024"
description = "Context-based HUD, and command palette for the Herdr workspace manager"
authors = ["Erich Json Fosse"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.29.0"
ratatui = "0.30.2"
libc = "0.2"
toml = "1.1.6+spec-1.1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
