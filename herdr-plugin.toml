id = "herdr-hud"
name = "Herdr HUD"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Context-based HUD, and command palette for the Herdr workspace manager"
authors = ["Erich Json Fosse"]
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[build]]
command = [
  "sh",
  "-c",
  "mkdir -p \"$HOME/.local/bin\" && rm -f \"$HOME/.local/bin/herdr-hud\" && cp -f target/release/herdr-hud \"$HOME/.local/bin/herdr-hud\" && echo \"\n  ✔ herdr-hud: Installed binary to $HOME/.local/bin/herdr-hud\n\"",
]

[[panes]]
id = "menu"
title = "Tuxedo Cat & Shortcuts"
platforms = ["linux", "macos"]
placement = "popup"
width = "65%"
height = 22
command = ["target/release/herdr-hud", "menu"]

[[actions]]
id = "hud-line"
title = "Print HUD line"
command = ["target/release/herdr-hud", "line"]

[[actions]]
id = "open-menu"
title = "Open Tuxedo Cat & Shortcut Reference"
command = ["target/release/herdr-hud", "menu"]

[[actions]]
id = "socket-check"
title = "Check Herdr socket connection"
command = ["target/release/herdr-hud", "check"]
